
project_id = "miit-rover-integration"

# Keep the isolated local stack outside Windows/Hyper-V excluded ranges that
# commonly cover Supabase's defaults (54321/54322). These settings affect only
# `supabase start`/local integration tests, never the hosted project.
[api]
port = 64321

[db]
port = 64322
shadow_port = 64320

[functions.ingest-robot-message]
enabled = true
verify_jwt = false
import_map = "./functions/ingest-robot-message/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ingest-robot-message/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ingest-robot-message/*.html" ]
